<div class="flex h-screen overflow-hidden bg-slate-50 text-slate-900">
  <!-- Sidebar - desktop (Column 1) -->
  <aside class="hidden border-r border-slate-200 lg:block lg:w-72 xl:w-80 flex-shrink-0">
    <app-sidebar [categories]="categories()" />
  </aside>

  <!-- Sidebar - mobile drawer -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" (click)="closeSidebar()"></div>
      <aside class="absolute left-0 top-0 h-full w-72 shadow-2xl">
        <app-sidebar [categories]="categories()" (navigate)="closeSidebar()" />
      </aside>
    </div>
  }

  <!-- Main feature stage (Column 2) -->
  <div class="flex flex-1 flex-col overflow-hidden min-w-0">
    <app-header
      [title]="currentExerciseTitle()"
      [subtitle]="currentExerciseCategory()"
      [showMenuButton]="true"
      (toggleSidebar)="toggleSidebar()"
    />

    <!-- Routed exercise component renders here -->
    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
