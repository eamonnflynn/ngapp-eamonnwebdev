name: CI & Staging Deployment

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Run unit tests
        working-directory: src
        run: npm test -- --run

      - name: Build application
        working-directory: src
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: staging-dist
          path: src/dist/ngapp-eamonnwebdev/browser/
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging FTP
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-dist
          path: staging-dist

      - name: Deploy to Staging via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_STAGING_SERVER }}
          username: ${{ secrets.FTP_STAGING_USERNAME }}
          password: ${{ secrets.FTP_STAGING_PASSWORD }}
          server-dir: ${{ secrets.FTP_STAGING_DIR }}
          local-dir: ./src/dist/ngapp-eamonnwebdev/browser/
          dangerous-clean-slate: true
